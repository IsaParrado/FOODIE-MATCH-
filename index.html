<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Foodie Match v3 — Encuentra tu match gastronómico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --terracotta: #C96F4A;
  --terracotta-dark: #B15E3B;
  --cream: #FAF7F2;
  --white: #FFFFFF;
  --brown: #6B5145;
  --gold: #D6A85F;
  --ink: #292624;
  --gray: #817A74;
  --line: #EEE6DC;
  --shadow: 0 8px 24px rgba(41,38,36,0.08);
  --shadow-sm: 0 2px 10px rgba(41,38,36,0.06);
  --radius: 20px;
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{ background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
.phone{ max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--cream); position: relative; display: flex; flex-direction: column; }
h1,h2,h3,.display{ font-family: 'Fraunces', serif; color: var(--ink); margin: 0; }
.main{ flex: 1; padding: 20px 20px 100px 20px; overflow-y: auto; }
::-webkit-scrollbar{ display:none; }
.v2-badge{ display:inline-block; background:var(--ink); color:white; font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:6px; vertical-align:middle; margin-left:6px;}

/* topbar */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding: 6px 2px 18px 2px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand .mark{ width:34px; height:34px; border-radius: 10px; background: var(--terracotta); display:flex; align-items:center; justify-content:center; color: white; font-size:17px; }
.brand .name{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; letter-spacing:-0.2px; }
.loc-pill{ display:flex; align-items:center; gap:6px; background: var(--white); border:1px solid var(--line); padding:7px 12px; border-radius:999px; font-size:12.5px; color: var(--brown); cursor:pointer; box-shadow: var(--shadow-sm); }

/* home */
.slogan{ color: var(--gray); font-size:14px; margin-top:2px; }
.hero-question{ font-size: 27px; line-height:1.25; margin: 22px 0 16px 0; font-weight:600; }
.search-bar{ display:flex; align-items:center; gap:10px; background: var(--white); border:1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
.search-bar input{ border:none; outline:none; background:transparent; flex:1; font-family:'Inter'; font-size:14.5px; color: var(--ink); }
.search-bar input::placeholder{ color: var(--gray); }
.quick-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:24px; }
.quick-chip{ background: var(--white); border:1px solid var(--line); border-radius:16px; padding: 14px 8px; text-align:center; cursor:pointer; box-shadow: var(--shadow-sm); transition: transform .12s ease; }
.quick-chip:active{ transform: scale(0.96); }
.quick-chip .ic{ font-size:20px; display:block; margin-bottom:6px; }
.quick-chip .lb{ font-size:11.5px; color: var(--brown); font-weight:600; }
.cta-main{ width:100%; border:none; border-radius:18px; padding:18px; background: var(--terracotta); color:white; font-family:'Fraunces', serif; font-size:18px; font-weight:600; cursor:pointer; box-shadow: var(--shadow); display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; }
.cta-main:active{ background: var(--terracotta-dark); }
.cta-secondary{ width:100%; border:1.5px solid var(--terracotta); border-radius:18px; padding:16px; background: transparent; color:var(--terracotta-dark); font-family:'Fraunces', serif; font-size:16px; font-weight:600; cursor:pointer; margin-bottom: 28px; display:flex; align-items:center; justify-content:center; gap:8px; }
.section-label{ font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase; color: var(--gray); font-weight:700; margin: 6px 0 12px 2px; }
.popular-row{ display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin-bottom: 10px;}
.popular-card{ min-width: 150px; background:var(--white); border-radius:16px; overflow:hidden; box-shadow: var(--shadow-sm); border:1px solid var(--line); cursor:pointer; flex-shrink:0; }
.popular-card img{ width:100%; height:90px; object-fit:cover; display:block; }
.popular-card .pc-body{ padding:9px 10px; }
.popular-card .pc-name{ font-size:12.5px; font-weight:700; }
.popular-card .pc-match{ font-size:11px; color: var(--terracotta-dark); font-weight:700; margin-top:2px;}

/* form controls */
.field{ margin-bottom: 26px; }
.field-title{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin-bottom:3px; }
.field-sub{ font-size:12.5px; color: var(--gray); margin-bottom: 12px; }
.chip-grid{ display:flex; flex-wrap:wrap; gap:9px; }
.chip{ padding: 10px 15px; border-radius: 999px; border:1.5px solid var(--line); background: var(--white); font-size:13.5px; color: var(--brown); cursor:pointer; font-weight:600; transition: all .12s ease; user-select:none; }
.chip.selected{ background: var(--terracotta); border-color: var(--terracotta); color:white; }
.chip.avoid.selected{ background: var(--ink); border-color: var(--ink); color:white; }
.chip.small{ padding:7px 12px; font-size:12.5px; }
.budget-row{ display:flex; gap:10px; }
.budget-opt{ flex:1; text-align:center; padding:14px 6px; border-radius:14px; border:1.5px solid var(--line); background:var(--white); cursor:pointer; font-weight:700; color:var(--brown); font-size:14px; }
.budget-opt.selected{ background: var(--gold); border-color:var(--gold); color:var(--ink); }
.budget-opt small{ display:block; font-weight:500; font-size:10px; margin-top:3px; color:inherit; opacity:.85;}
.top-nav-back{ display:flex; align-items:center; gap:10px; margin-bottom: 6px; cursor:pointer; color: var(--brown); font-size:13.5px; font-weight:600; }

/* group */
.stepper{ display:flex; align-items:center; justify-content:center; gap:22px; margin: 18px 0 26px 0; }
.stepper button{ width:46px; height:46px; border-radius:50%; border:none; background: var(--terracotta); color:white; font-size:20px; cursor:pointer; box-shadow: var(--shadow-sm); }
.stepper .count{ font-family:'Fraunces', serif; font-size:34px; font-weight:600; min-width:50px; text-align:center;}
.person-card{ background: var(--white); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.person-card .p-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.person-card .p-name{ font-weight:700; font-size:14px; }
.person-card select{ width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); font-family:'Inter'; font-size:13.5px; color: var(--ink); background: var(--cream); margin-bottom:8px; }

/* bottom nav */
.bottomnav{ position: sticky; bottom:0; left:0; right:0; background: rgba(250,247,242,0.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display:flex; justify-content:space-around; padding: 10px 0 14px 0; max-width:430px; margin:0 auto; }
.navitem{ display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color: var(--gray); }
.navitem.active{ color: var(--terracotta-dark); }
.navitem .ic{ font-size:19px; }
.navitem .lb{ font-size:10.5px; font-weight:600; }

/* results */
.mode-toggle{ display:flex; gap:8px; margin-bottom:16px; }
.mode-toggle button{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--line); background:var(--white); font-size:12.5px; font-weight:700; color:var(--brown); cursor:pointer; }
.mode-toggle button.active{ background: var(--ink); color:white; border-color:var(--ink); }
.rcard{ background: var(--white); border-radius: var(--radius); overflow:hidden; margin-bottom:18px; box-shadow: var(--shadow); border:1px solid var(--line); cursor:pointer; }
.rcard img{ width:100%; height:150px; object-fit:cover; display:block; }
.rcard-body{ padding:16px; }
.rcard-top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px;}
.rcard-name{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; }
.match-badge{ display:flex; align-items:center; gap:5px; background: var(--terracotta); color:white; padding: 5px 11px; border-radius:999px; font-weight:800; font-size:13px; flex-shrink:0; margin-left:8px; }
.rcard-meta{ display:flex; gap:12px; font-size:12.5px; color: var(--gray); margin-bottom:10px; flex-wrap:wrap;}
.rcard-meta span{ display:flex; align-items:center; gap:4px; }
.why-box{ background: var(--cream); border-radius:12px; padding:10px 12px; font-size:12.5px; color: var(--brown); margin-bottom: 10px; line-height:1.7; }
.why-box b{ color: var(--ink); }
.reco-row{ display:flex; gap:8px; font-size:11.5px; color: var(--gray); margin-bottom:10px;}
.card-actions{ display:flex; gap:8px; }
.btn-sm{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--white); font-size:12.5px; font-weight:700; color:var(--brown); cursor:pointer; text-align:center; }
.btn-sm.fav{ border-color: var(--terracotta); color: var(--terracotta-dark); }
.btn-sm.fav.saved{ background: var(--terracotta); color:white; }
.empty-state{ text-align:center; padding: 60px 20px; color: var(--gray); }
.empty-state .e-ic{ font-size:38px; margin-bottom:10px; }

/* detail */
.gallery{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; border-radius:16px; }
.gallery img{ width: 260px; height:170px; object-fit:cover; border-radius:14px; flex-shrink:0; }
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
.detail-title{ font-size:23px; font-weight:600; }
.detail-meta{ display:flex; gap:14px; font-size:13px; color: var(--gray); margin-bottom:16px; flex-wrap:wrap;}
.info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.info-item{ background: var(--white); border:1px solid var(--line); border-radius:14px; padding:12px; }
.info-item .lbl{ font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.info-item .val{ font-size:13.5px; font-weight:600; margin-top:3px; }
.match-circle-wrap{ display:flex; align-items:center; gap:16px; background: var(--white); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px; box-shadow: var(--shadow-sm);}
.match-circle{ width:74px; height:74px; border-radius:50%; flex-shrink:0; background: conic-gradient(var(--terracotta) calc(var(--pct)*1%), var(--line) 0); display:flex; align-items:center; justify-content:center; }
.match-circle .inner{ width:58px; height:58px; border-radius:50%; background:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.match-circle .inner b{ font-size:16px; font-family:'Fraunces', serif; }
.dish-row{ display:flex; gap:12px; margin-bottom:20px; }
.dish-card{ flex:1; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:12px; }
.dish-card .d-lbl{ font-size:11px; color:var(--gray); font-weight:700; text-transform:uppercase; margin-bottom:4px;}
.dish-card .d-name{ font-weight:700; font-size:14px; }
.detail-actions{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:22px;}
.detail-actions .full{ grid-column: 1 / -1; }
.btn-primary{ padding:14px; border-radius:14px; border:none; background: var(--terracotta); color:white; font-weight:700; font-size:14px; cursor:pointer; }
.btn-outline{ padding:14px; border-radius:14px; border:1.5px solid var(--brown); background:transparent; color:var(--brown); font-weight:700; font-size:14px; cursor:pointer; }

/* tabs */
.tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); }
.tab{ padding:10px 4px; margin-right:14px; font-size:13px; font-weight:700; color:var(--gray); cursor:pointer; border-bottom:2px solid transparent; }
.tab.active{ color:var(--terracotta-dark); border-bottom-color: var(--terracotta); }

/* menu / carta */
.menu-cat{ font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin: 18px 0 10px 0; }
.menu-item{ display:flex; gap:12px; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:10px; }
.menu-item img{ width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0; }
.menu-item .mi-name{ font-weight:700; font-size:13.5px; }
.menu-item .mi-desc{ font-size:11.5px; color:var(--gray); margin:2px 0 6px 0; line-height:1.4; }
.menu-item .mi-ing{ font-size:10.5px; color:var(--brown); }
.menu-item .mi-price{ font-weight:800; color:var(--terracotta-dark); font-size:13px; white-space:nowrap; margin-left:auto; align-self:flex-start; }
.avg-price-banner{ background: var(--brown); color:white; padding:12px 14px; border-radius:14px; font-size:12.5px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
.avg-price-banner b{ font-family:'Fraunces', serif; font-size:15px; }

/* reviews */
.rating-summary{ display:flex; gap:18px; align-items:center; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
.rating-big{ font-family:'Fraunces', serif; font-size:38px; font-weight:600; }
.cat-bars{ flex:1; display:flex; flex-direction:column; gap:6px; }
.cat-bar-row{ display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--gray); }
.cat-bar-row .lbl{ width:78px; flex-shrink:0; }
.cat-bar-track{ flex:1; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
.cat-bar-fill{ height:100%; background: var(--gold); }
.review-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:10px; }
.review-card .rv-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.review-card .rv-user{ font-weight:700; font-size:13px; }
.review-card .rv-stars{ color:var(--gold); font-size:12px; }
.review-card .rv-text{ font-size:12.5px; color:var(--brown); line-height:1.5; }
.add-review-btn{ width:100%; padding:13px; border-radius:14px; border:1.5px dashed var(--terracotta); background:transparent; color:var(--terracotta-dark); font-weight:700; font-size:13px; cursor:pointer; margin-bottom:16px;}

/* social */
.friend-row{ display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:9px; }
.friend-row .f-avatar{ width:34px; height:34px; border-radius:50%; background:var(--gold); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Fraunces';}
.friend-row .f-text{ font-size:12.5px; color:var(--brown); }
.friend-row .f-text b{ color:var(--ink); }
.share-btn{ width:100%; padding:14px; border-radius:14px; border:1.5px solid var(--brown); background:transparent; color:var(--brown); font-weight:700; font-size:13.5px; cursor:pointer; margin:16px 0; display:flex; align-items:center; justify-content:center; gap:8px;}

/* directions */
.map-box{ background: linear-gradient(135deg, #EFE6D8, #E3D5C0); border-radius:16px; padding:18px; margin-bottom:14px; position:relative; overflow:hidden; border:1px solid var(--line);}
.map-box .pin{ position:absolute; font-size:22px; }
.route-line{ height:2px; background: repeating-linear-gradient(90deg, var(--terracotta) 0 6px, transparent 6px 12px); margin: 30px 10px; }
.time-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom:14px; }
.time-item{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
.time-item .t-ic{ font-size:16px; display:block; margin-bottom:3px;}
.time-item .t-val{ font-weight:800; font-size:13px; }
.time-item .t-lbl{ font-size:9.5px; color:var(--gray); text-transform:uppercase; }
.gmaps-btn{ width:100%; padding:14px; border-radius:14px; border:none; background:#1a73e8; color:white; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; margin-bottom: 20px;}

/* reservas */
.date-scroll{ display:flex; gap:9px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; }
.date-chip{ flex-shrink:0; width:64px; text-align:center; padding:12px 6px; border-radius:16px; border:1.5px solid var(--line); background:var(--white); cursor:pointer; }
.date-chip .dc-day{ font-size:10.5px; color:var(--gray); font-weight:700; text-transform:uppercase; }
.date-chip .dc-num{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; margin-top:2px; }
.date-chip.selected{ background: var(--terracotta); border-color:var(--terracotta); }
.date-chip.selected .dc-day, .date-chip.selected .dc-num{ color:white; }
.time-slot-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:9px; margin-bottom:20px; }
.time-slot{ text-align:center; padding:12px 4px; border-radius:12px; border:1.5px solid var(--line); background:var(--white); cursor:pointer; font-size:13px; font-weight:700; color:var(--brown); }
.time-slot.selected{ background: var(--gold); border-color:var(--gold); color:var(--ink); }
.time-slot.disabled{ opacity:.35; pointer-events:none; text-decoration:line-through; }
.people-stepper{ display:flex; align-items:center; justify-content:center; gap:18px; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:20px; }
.people-stepper button{ width:38px; height:38px; border-radius:50%; border:none; background:var(--cream); border:1px solid var(--line); font-size:17px; cursor:pointer; color:var(--brown); }
.people-stepper .pc{ font-family:'Fraunces', serif; font-size:22px; font-weight:600; min-width:70px; text-align:center; }
.reserve-summary{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:20px; }
.reserve-summary .rs-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line); }
.reserve-summary .rs-row:last-child{ border-bottom:none; }
.reserve-summary .rs-row span:first-child{ color:var(--gray); }
.reserve-summary .rs-row span:last-child{ font-weight:700; }
.confirm-check{ width:64px; height:64px; border-radius:50%; background: var(--terracotta); color:white; display:flex; align-items:center; justify-content:center; font-size:28px; margin:20px auto 14px auto; }
.name-input{ width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--white); font-family:'Inter'; font-size:14px; margin-bottom:20px; }

/* profile / favorites */
.profile-head{ display:flex; align-items:center; gap:14px; margin-bottom: 24px; }
.avatar{ width:58px; height:58px; border-radius:50%; background: var(--gold); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:white; font-family:'Fraunces', serif;}
.list-item{ display:flex; align-items:center; justify-content:space-between; background:var(--white); border:1px solid var(--line); padding:14px 16px; border-radius:14px; margin-bottom:10px; cursor:pointer; }
.list-item .li-lbl{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;}
.hist-item{ font-size:13px; color: var(--brown); padding:10px 4px; border-bottom:1px solid var(--line); }
.pref-summary-tag{ display:inline-block; background:var(--cream); border:1px solid var(--line); padding:4px 10px; border-radius:999px; font-size:11.5px; margin:0 6px 6px 0; color:var(--brown);}

@media (min-width:431px){ body{ background: #EDE7DC; } .phone{ box-shadow: 0 0 60px rgba(0,0,0,0.08); } }
</style>
</head>

<div class="phone">
  <div class="main" id="main"></div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<script>
/* ============ DATA ============ */
const CUISINES = ["Italiana","Francesa","Española","Colombiana","Mexicana","Japonesa","China","Coreana","India","Tailandesa","Argentina","Brasileña","Peruana","Árabe","Griega","Americana","Comida rápida","Comida saludable","Repostería y postres","Cafeterías"];
const INGREDIENTS = ["Lechuga","Zanahoria","Aguacate","Tomate","Maíz","Papa","Queso","Huevo","Pollo","Carne","Pescado","Mariscos","Champiñones","Pasta","Arroz","Chocolate","Frutas","Picante"];
const FLAVORS = ["Dulce","Salado","Ácido","Picante","Amargo","Agridulce"];
const DISHTYPES = [["entrada","Entrada"],["platoFuerte","Plato fuerte"],["postre","Postre"],["compartir","Para compartir"]];
const AMBIENTES = [["casual","Casual"],["familiar","Familiar"],["elegante","Elegante"],["tranquilo","Tranquilo"],["moderno","Moderno"],["romantico","Para celebrar"]];
const BUDGETS = [["$","Económico"],["$$","Moderado"],["$$$","Alto"],["$$$$","Premium"]];
const FOOD_IMG = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=60";

function menuItem(name, desc, price, ing, img){ return {name, desc, price, ingredients:ing, img: img||FOOD_IMG}; }

const RESTAURANTS = [
  { id:1, name:"La Trattoria", cuisine:["Italiana"], ingredients:["Pasta","Queso","Tomate"], flavors:["salado","agridulce"], price:2, dishTypes:["entrada","platoFuerte","postre","compartir"], ambiente:["moderno","romantico"], distance:1.2, rating:4.7, groupFriendly:true, capacityLarge:true, dish:"Lasaña boloñesa", dessert:"Tiramisú", avgPerson:42000,

const DAY_NAMES = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DAY_NAMES_FULL = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function nextDays(n){
  const out=[]; const today=new Date();
  for(let i=0;i<n;i++){ const d=new Date(today); d.setDate(today.getDate()+i); out.push(d); }
  return out;
}
function timeSlotsFor(r, date){
  const all = ["12:00 p. m.","1:00 p. m.","2:00 p. m.","6:00 p. m.","7:00 p. m.","8:00 p. m.","9:00 p. m."];
  // simula disponibilidad: algunos horarios ya ocupados según el día
  const dayIdx = date.getDate();
  return all.map(t => ({ time:t, available: (dayIdx + t.length) % 5 !== 0 }));
}
function resetReservation(){ state.reservation = { date:null, time:null, people:2, name:"", step:"date", confirmed:false }; }
function confirmReservation(){
  const r = RESTAURANTS.find(x=>x.id===state.selectedId);
  const res = { ...state.reservation, restaurant:r.name, id: Date.now() };
  state.reservations.unshift(res);

  addHistory("Reserva en "+r.name+" — "+res.date+" "+res.time);
  render();
}

function fmtCOP(n){ return "$"+n.toLocaleString("es-CO"); }
function avgRating(r){ const s=r.reviews.reduce((a,x)=>a+x.rating,0); return (s/r.reviews.length).toFixed(1); }
function avgCat(r,key){ const s=r.reviews.reduce((a,x)=>a+x.cat[key],0); return s/r.reviews.length; }

/* ============ MATCHING (mejorado: incluye calificación) ============ */
function scoreIndividual(r, p){
  let score = 0; const reasons = [];
  if(p.cuisines.length===0){ score += 22; }
  else{
    const matched = p.cuisines.filter(c=> r.cuisine.map(norm).includes(norm(c)));
    score += 22*(matched.length? 1 : 0);
    if(matched.length) reasons.push("Tiene comida "+matched.join(", ").toLowerCase()+".");
  }
  const hasAvoid = p.avoid.some(a => r.ingredients.map(norm).includes(norm(a)));
  if(hasAvoid){ /* penaliza este bloque */ }
  else if(p.liked.length===0){ score += 18; }
  else {
    const matched = p.liked.filter(l => r.ingredients.map(norm).includes(norm(l)));
    score += 18 * (matched.length/p.liked.length);
    matched.forEach(m=> reasons.push("Tiene "+m.toLowerCase()+"."));
  }
  if(p.flavors.length===0){ score += 13; }
  else {
    const matched = p.flavors.filter(f=> r.flavors.map(norm).includes(norm(f)));
    score += 13*(matched.length/p.flavors.length);
    if(matched.length) reasons.push("Tiene sabores "+matched.join(", ").toLowerCase()+".");
  }
  const priceMap = {"$":1,"$$":2,"$$$":3,"$$$$":4};
  if(!p.budget){ score += 13; }
  else {
    const diff = Math.abs(priceMap[p.budget]-r.price);
    if(diff===0){ score+=13; reasons.push("Está dentro de tu presupuesto."); }
    else if(diff===1){ score+=6; }
  }
  if(p.dishTypes.length===0){ score += 9; }
  else{
    const matched = p.dishTypes.filter(d=> r.dishTypes.includes(d));
    score += 9*(matched.length/p.dishTypes.length);
    if(matched.includes("postre")) reasons.push("Tiene postres.");
    if(matched.includes("compartir")) reasons.push("Tiene opciones para compartir.");
  }
  if(r.distance<=1) score+=5; else if(r.distance<=2) score+=4; else if(r.distance<=3) score+=3; else score+=1.5;
  if(r.distance<=1.5) reasons.push("Está a "+r.distance+" km de tu ubicación.");
  if(p.ambiente.length===0){ score+=8; }
  else{
    const matched = p.ambiente.filter(a=> r.ambiente.includes(a));
    score += 8*(matched.length/p.ambiente.length);
  }
  // calificación de otros usuarios (nuevo)
  const ratingBonus = ((r.rating-3.5)/1.5)*12; // hasta 12 pts
  score += Math.max(0, ratingBonus);
  reasons.push("Tiene una calificación de "+r.rating+" estrellas.");
  return { pct: Math.round(Math.max(0,Math.min(100,score))), reasons: reasons.slice(0,7) };
}

function scoreGroup(r, members, settings){
  let score = 0; const reasons = [];
  const chosen = members.filter(m=>m.cuisine);
  const matchCount = chosen.filter(m=> r.cuisine.map(norm).includes(norm(m.cuisine))).length;
  const total = chosen.length || 1;
  score += 26 * (chosen.length? matchCount/total : 1);
  if(chosen.length) reasons.push(matchCount+" de "+chosen.length+" personas coinciden con el tipo de comida.");
  score += r.groupFriendly? 18:5;
  if(r.groupFriendly) reasons.push("Tiene mesas para grupos.");
  if(r.price<=settings.budget){ score+=18; reasons.push("Está dentro del presupuesto."); } else if(r.price===settings.budget+1){ score+=7; }
  if(settings.ambiente.length===0){ score+=9; } else{
    const m = settings.ambiente.filter(a=>r.ambiente.includes(a));
    score += 9*(m.length/settings.ambiente.length);
  }
  if(r.dishTypes.length>=3){ score+=9; reasons.push("Tiene variedad de platos."); }
  if(r.dishTypes.includes("compartir")){ score+=5; reasons.push("Tiene opciones para compartir."); }
  if(r.dishTypes.includes("postre")){ score+=5; reasons.push("Tiene postres."); }
  if(settings.bigTable && r.capacityLarge){ reasons.push("Tiene espacio para grupos grandes."); }
  const ratingBonus = ((r.rating-3.5)/1.5)*10;
  score += Math.max(0, ratingBonus);
  reasons.push("Tiene una calificación de "+r.rating+" estrellas.");
  return { pct: Math.round(Math.max(0,Math.min(100,score))), reasons: reasons.slice(0,7) };
}
function computeResults(){
  return state.mode==="individual"
    ? RESTAURANTS.map(r=>({ r, ...scoreIndividual(r, state.prefs) })).sort((a,b)=>b.pct-a.pct)
    : RESTAURANTS.map(r=>({ r, ...scoreGroup(r, state.groupMembers, state.groupSettings) })).sort((a,b)=>b.pct-a.pct);
}

    <h2 style="font-size:22px;">¿Con cuántas personas vas?</h2>

    <div class="stepper"><button onclick="state.groupSize=Math.max(2,state.groupSize-1); render()">–</button><div class="count">${state.groupSize}</div><button onclick="state.groupSize=Math.min(12,state.groupSize+1); render()">+</button></div>
    ${state.groupMembers.map((m,idx)=>`
      <div class="person-card">
        <div class="p-head"><div class="p-name">👤 ${m.name}</div></div>
        <select onchange="state.groupMembers[${idx}].cuisine=this.value; render()">
          <option value="">Tipo de comida favorita...</option>
          ${CUISINES.map(c=>`<option value="${c}" ${m.cuisine===c?'selected':''}>${c}</option>`).join("")}
        </select>
      </div>
    `).join("")}
    <div class="field" style="margin-top:20px;">
      <div class="field-title">Presupuesto máximo por persona</div>
      <div class="budget-row">${["$","$$","$$$","$$$$"].map((k,i)=>`<div class="budget-opt ${s.budget===i+1?'selected':''}" onclick="state.groupSettings.budget=${i+1}; render()">${k}</div>`).join("")}</div>
    </div>
    <div class="field"><div class="field-title">Ambiente</div><div class="chip-grid">${AMBIENTES.map(([k,l])=>`<div class="chip small ${s.ambiente.includes(k)?'selected':''}" onclick="toggleArr(state.groupSettings.ambiente,'${k}'); render()">${l}</div>`).join("")}</div></div>
    <div class="field"><label class="list-item" style="cursor:pointer;"><span class="li-lbl">🪑 Necesitamos mesa grande</span><input type="checkbox" ${s.bigTable?'checked':''} onchange="state.groupSettings.bigTable=this.checked; render()"></label></div>
    <button class="cta-main" onclick="submitGroup()">Encontrar nuestro Match ❤️</button>
  `;
}
function submitGroup(){ state.mode="group"; addHistory("Restaurantes para "+state.groupSize+" personas"); go('results'); }

/* ============ RESULTS ============ */
function renderResults(){
  const results = computeResults();
  const heading = state.mode==="group" ? "Match para tu grupo" : "Tu Match de hoy";
  return `
    <div class="top-nav-back" onclick="go(state.mode==='group'?'group':'prefs')">← Ajustar preferencias</div>
    <h2 style="font-size:22px; margin-bottom:14px;">${heading}</h2>
    <div class="mode-toggle">
      <button class="${state.mode==='individual'?'active':''}" onclick="state.mode='individual'; render()">😋 Individual</button>
      <button class="${state.mode==='group'?'active':''}" onclick="state.mode='group'; render()">👥 Grupo</button>
    </div>
    ${results.map(({r,pct,reasons})=>`
      <div class="rcard" onclick="state.selectedId=${r.id}; state.detailTab='match'; go('detail')">
        <img src="${r.img}" alt="${r.name}">
        <div class="rcard-body">
          <div class="rcard-top"><div class="rcard-name">${r.name}</div><div class="match-badge">${pct}% ❤️</div></div>
          <div class="rcard-meta"><span>⭐ ${r.rating}</span><span>💰 ${priceLabel(r.price)}</span><span>📍 ${r.distance} km</span><span>👤 ~${fmtCOP(r.avgPerson)}</span></div>
          <div class="why-box"><b>¿Por qué es tu Match?</b><br>${reasons.length? reasons.map(x=>"✓ "+x).join("<br>") : "Coincidencia general con tus preferencias."}</div>
          <div class="reco-row"><span>🍽️ ${r.dish}</span><span>·</span><span>🍰 ${r.dessert}</span></div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <div class="btn-sm" onclick="state.selectedId=${r.id}; state.detailTab='match'; go('detail')">Ver restaurante</div>
            <div class="btn-sm fav ${state.favorites.has(r.id)?'saved':''}" onclick="toggleFav(${r.id})">${state.favorites.has(r.id)?'❤️ Guardado':'🤍 Guardar'}</div>
          </div>
        </div>
      </div>
    `).join("")}
  `;
}
function toggleFav(id){ if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id); render(); }

/* ============ DETAIL (con tabs: Match / Carta / Reseñas / Cómo llegar / Amigos) ============ */
function renderDetail(){
  const r = RESTAURANTS.find(x=>x.id===state.selectedId);
  if(!r) return `<div class="empty-state">Restaurante no encontrado.</div>`;
  const score = state.mode==="group" ? scoreGroup(r, state.groupMembers, state.groupSettings) : scoreIndividual(r, state.prefs);
  const tabs = [["match","❤️ Match"],["carta","📖 Carta"],["reviews","⭐ Reseñas"],["reserve","📅 Reservar"],["directions","📍 Llegar"],["social","👥 Amigos"]];

  const tabsHtml = `<div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${state.detailTab===k?'active':''}" onclick="state.detailTab='${k}'; render()">${l}</div>`).join("")}</div>`;

  let body = "";
  if(state.detailTab==="match"){
    body = `
      <div class="match-circle-wrap">
        <div class="match-circle" style="--pct:${score.pct}"><div class="inner"><b>${score.pct}%</b></div></div>
        <div><div style="font-family:'Fraunces'; font-weight:600; font-size:15px;">¿Por qué es tu Match?</div><div style="font-size:12px; color:var(--gray);">${state.mode==='group'?'Basado en tu grupo, calificación y más':'Basado en tus gustos y calificación'}</div></div>
      </div>
      <div class="why-box" style="margin-bottom:18px;">${score.reasons.map(x=>"✓ "+x).join("<br>")||"Buena opción general."}</div>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">Ambiente</div><div class="val">${r.ambiente.map(a=>AMBIENTES.find(x=>x[0]===a)[1]).join(", ")}</div></div>
        <div class="info-item"><div class="lbl">Ubicación</div><div class="val">${r.address}</div></div>
        <div class="info-item"><div class="lbl">Capacidad</div><div class="val">${r.capacityLarge? "Grupos grandes":"Mesas pequeñas"}</div></div>
        <div class="info-item"><div class="lbl">Para grupos</div><div class="val">${r.groupFriendly? "Sí, recomendado":"Limitado"}</div></div>
      </div>
      <div class="section-label">Recomendado para ti</div>
      <div class="dish-row">
        <div class="dish-card"><div class="d-lbl">Plato fuerte</div><div class="d-name">🍽️ ${r.dish}</div></div>
        <div class="dish-card"><div class="d-lbl">Postre</div><div class="d-name">🍰 ${r.dessert}</div></div>
      </div>
      <div class="detail-actions">
        <button class="btn-primary" onclick="state.detailTab='directions'; render()">📍 Cómo llegar</button>
        <button class="btn-outline" onclick="state.detailTab='carta'; render()">Ver menú</button>
        <button class="btn-primary full" onclick="resetReservation(); state.detailTab='reserve'; render()">📅 Reservar</button>
      </div>
      <button class="share-btn" onclick="shareRestaurant(${r.id})">🔗 Compartir restaurante</button>
    `;
  } else if(state.detailTab==="reserve"){
    body = renderReserve(r);
  } else if(state.detailTab==="carta"){
    const cats = [["entradas","Entradas"],["platosFuertes","Platos fuertes"],["postres","Postres"],["bebidas","Bebidas"]];
    body = `
      <div class="avg-price-banner"><span>Precio promedio por persona</span><b>${fmtCOP(Math.round(r.avgPerson*0.85))} – ${fmtCOP(Math.round(r.avgPerson*1.15))}</b></div>
      ${cats.map(([k,l])=> r.menu[k] && r.menu[k].length ? `
        <div class="menu-cat">${l}</div>
        ${r.menu[k].map(item=>`
          <div class="menu-item">
            <img src="${item.img}" alt="${item.name}">
            <div style="flex:1;">
              <div class="mi-name">${item.name}</div>
              ${item.desc? `<div class="mi-desc">${item.desc}</div>`:""}
              ${item.ingredients.length? `<div class="mi-ing">Incluye: ${item.ingredients.join(", ")}</div>`:""}
            </div>
            <div class="mi-price">${fmtCOP(item.price)}</div>
          </div>
        `).join("")}
      `:"").join("")}
    `;
  } else if(state.detailTab==="reviews"){
    const cats = [["comida","Calidad de la comida"],["servicio","Servicio"],["ambiente","Ambiente"],["precio","Relación calidad-precio"],["variedad","Variedad del menú"]];
    body = `
      <div class="rating-summary">
        <div><div class="rating-big">${avgRating(r)}</div><div style="color:var(--gold); font-size:13px;">${"★".repeat(Math.round(avgRating(r)))}${"☆".repeat(5-Math.round(avgRating(r)))}</div><div style="font-size:11px; color:var(--gray);">${r.reviews.length} reseñas</div></div>
        <div class="cat-bars">${cats.map(([k,l])=>`<div class="cat-bar-row"><span class="lbl">${l}</span><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${avgCat(r,k)/5*100}%"></div></div></div>`).join("")}</div>
      </div>
      <button class="add-review-btn" onclick="addReview(${r.id})">✏️ Escribir una reseña</button>
      ${r.reviews.map(rv=>`
        <div class="review-card">
          <div class="rv-head"><span class="rv-user">${rv.user}</span><span class="rv-stars">${"★".repeat(rv.rating)}${"☆".repeat(5-rv.rating)}</span></div>
          <div class="rv-text">${rv.text}</div>
        </div>
      `).join("")}
    `;
  } else if(state.detailTab==="directions"){
    const gmapsUrl = "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(r.address);
    const walkMin = Math.round(r.distance*12);
    const bikeMin = Math.round(r.distance*4.5);
    const carMin = Math.round(r.distance*2.5)+3;
    const transitMin = Math.round(r.distance*5)+5;
    body = `
      <div class="map-box">
        <div class="pin" style="left:14px; top:14px;">🧍</div>
        <div class="pin" style="right:14px; bottom:14px;">📍</div>
        <div class="route-line"></div>
        <div style="text-align:center; font-size:12px; color:var(--brown); margin-top:6px;">${state.location} → ${r.name} · ${r.distance} km</div>
      </div>
      <div class="time-grid">
        <div class="time-item"><span class="t-ic">🚶</span><div class="t-val">${walkMin} min</div><div class="t-lbl">Caminando</div></div>
        <div class="time-item"><span class="t-ic">🚗</span><div class="t-val">${carMin} min</div><div class="t-lbl">Automóvil</div></div>
        <div class="time-item"><span class="t-ic">🚌</span><div class="t-val">${transitMin} min</div><div class="t-lbl">Transporte</div></div>
      </div>
      <div class="info-item" style="margin-bottom:16px;"><div class="lbl">Dirección</div><div class="val">${r.address}</div></div>
      <a class="gmaps-btn" href="${gmapsUrl}" target="_blank" rel="noopener">🗺️ Abrir en Google Maps</a>
    `;
  } else if(state.detailTab==="social"){
    body = `
      <div class="section-label">A tus contactos les gustó este restaurante</div>
      ${r.friends.map(f=>`<div class="friend-row"><div class="f-avatar">${f.name[0]}</div><div class="f-text"><b>${f.name}</b> ${f.action}.</div></div>`).join("")}
      <button class="share-btn" style="margin-top:16px;" onclick="shareRestaurant(${r.id})">🔗 Compartir restaurante con un amigo</button>
    `;
  }

return `
    <div class="top-nav-back" onclick="go('results')">← Volver a resultados</div>
    <div class="gallery"><img src="${r.img}" alt="${r.name}"><img src="${r.img}&sat=-30" alt="${r.name} plato"></div>
    <div class="detail-head">
      <div><div class="detail-title">${r.name}</div><div style="color:var(--gray); font-size:13px;">${r.cuisine.join(", ")}</div></div>
      <div class="btn-sm fav ${state.favorites.has(r.id)?'saved':''}" style="flex:none; padding:10px 14px;" onclick="toggleFav(${r.id})">${state.favorites.has(r.id)?'❤️':'🤍'}</div>
    </div>
    <div class="detail-meta"><span>⭐ ${avgRating(r)} (${r.reviews.length})</span><span>💰 ${priceLabel(r.price)}</span><span>📍 ${r.distance} km</span><span>🕐 ${r.hours}</span></div>
    ${tabsHtml}
    ${body}
  `;
}
function renderReserve(r){
  const res = state.reservation;

  if(res.confirmed){
    return `
      <div class="confirm-check">✓</div>
      <h2 style="text-align:center; font-size:20px; margin-bottom:6px;">¡Reserva confirmada!</h2>
      <div style="text-align:center; color:var(--gray); font-size:13px; margin-bottom:20px;">Te esperamos en ${r.name}</div>
      <div class="reserve-summary">
        <div class="rs-row"><span>Restaurante</span><span>${r.name}</span></div>
        <div class="rs-row"><span>Fecha</span><span>${res.dateLabel}</span></div>
        <div class="rs-row"><span>Hora</span><span>${res.time}</span></div>
        <div class="rs-row"><span>Personas</span><span>${res.people}</span></div>
        ${res.name? `<div class="rs-row"><span>A nombre de</span><span>${res.name}</span></div>`:""}
      </div>
      <div class="detail-actions">
        <button class="btn-outline" onclick="resetReservation(); render()">Nueva reserva</button>
        <button class="btn-primary" onclick="state.detailTab='match'; render()">Volver al restaurante</button>
      </div>
    `;
  }

const days = nextDays(6).map(d=>({ d, dayName: DAY_NAMES[d.getDay()], dayNum: d.getDate() }));

  if(res.step==="date"){
    return `
      <div class="field-title" style="margin-bottom:4px;">Selecciona una fecha</div>
      <div class="field-sub">Elige el día en el que quieres visitar ${r.name}.</div>
      <div class="date-scroll">
        ${days.map(({d,dayName,dayNum})=>`
          <div class="date-chip ${res.dateKey===d.toDateString()?'selected':''}" onclick='selectReserveDate(${d.getTime()})'>
            <div class="dc-day">${dayName}</div><div class="dc-num">${dayNum}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  if(res.step==="time"){
    const slots = timeSlotsFor(r, new Date(res.dateKeyRaw));
    return `
      <div class="top-nav-back" onclick="state.reservation.step='date'; render()">← Cambiar fecha</div>
      <div class="field-title" style="margin-bottom:4px;">${res.dateLabel}</div>
      <div class="field-sub">Horas disponibles para tu reserva.</div>
      <div class="time-slot-grid">
        ${slots.map(s=>`<div class="time-slot ${s.available?'':'disabled'} ${res.time===s.time?'selected':''}" onclick="${s.available? `selectReserveTime('${s.time}')`:''}">${s.time}</div>`).join("")}
      </div>
    `;
  }

if(res.step==="details"){
    return `
      <div class="top-nav-back" onclick="state.reservation.step='time'; render()">← Cambiar hora</div>
      <div class="reserve-summary">
        <div class="rs-row"><span>Restaurante</span><span>${r.name}</span></div>
        <div class="rs-row"><span>Fecha</span><span>${res.dateLabel}</span></div>
        <div class="rs-row"><span>Hora</span><span>${res.time}</span></div>
      </div>
      <div class="field-title" style="margin-bottom:10px;">¿Cuántas personas?</div>
      <div class="people-stepper">
        <button onclick="state.reservation.people=Math.max(1,state.reservation.people-1); render()">–</button>
        <div class="pc">${res.people} ${res.people===1?'persona':'personas'}</div>
        <button onclick="state.reservation.people=Math.min(20,state.reservation.people+1); render()">+</button>
      </div>
      <div class="field-title" style="margin-bottom:10px;">A nombre de (opcional)</div>
      <input class="name-input" placeholder="Tu nombre" value="${res.name}" oninput="state.reservation.name=this.value">
      <button class="cta-main" onclick="confirmReservation()">Confirmar reserva ❤️</button>
    `;
  }
}
function selectReserveDate(ts){
  const d = new Date(ts);
  state.reservation.dateKey = d.toDateString();
  state.reservation.dateKeyRaw = ts;
  state.reservation.dateLabel = DAY_NAMES_FULL[d.getDay()]+" "+d.getDate()+" de "+MONTH_NAMES[d.getMonth()];
  state.reservation.step = "time";
  render();
}
function selectReserveTime(t){ state.reservation.time = t; state.reservation.step = "details"; render(); }

function shareRestaurant(id){
  const r = RESTAURANTS.find(x=>x.id===id);
  const text = "Mira este restaurante en Foodie Match: "+r.name+" — "+r.dish+" 😋";
  if(navigator.share){ navigator.share({title:r.name, text}); }
  else{ alert("Enlace copiado para compartir:\\n\\n"+text); }
}
function addReview(id){
  const r = RESTAURANTS.find(x=>x.id===id);
  const stars = prompt("¿Cuántas estrellas le das a "+r.name+"? (1-5)","5");
  if(!stars) return;
  const text = prompt("Cuéntanos tu experiencia:","");
  if(text===null) return;
  r.reviews.push({user:"Tú", rating: Math.max(1,Math.min(5,parseInt(stars)||5)), text: text||"¡Muy buena experiencia!", cat:{comida:5,servicio:5,ambiente:5,precio:4,variedad:4}});
  render();
}
/* ============ FAVORITES ============ */
function renderFavorites(){
  const favs = RESTAURANTS.filter(r=>state.favorites.has(r.id));
  if(favs.length===0){
    return `<h2 style="font-size:22px;">Favoritos</h2><div class="empty-state"><div class="e-ic">🤍</div>Aún no has guardado restaurantes.<br>Guarda los que más te gusten para verlos aquí.</div>`;
  }
  return `
    <h2 style="font-size:22px; margin-bottom:16px;">Favoritos</h2>
    ${favs.map(r=>`
      <div class="rcard" onclick="state.selectedId=${r.id}; state.detailTab='match'; go('detail')">
        <img src="${r.img}">
        <div class="rcard-body">
          <div class="rcard-top"><div class="rcard-name">${r.name}</div><div class="match-badge">⭐ ${avgRating(r)}</div></div>
          <div class="rcard-meta"><span>💰 ${priceLabel(r.price)}</span><span>📍 ${r.distance} km</span></div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <div class="btn-sm" onclick="state.selectedId=${r.id}; state.detailTab='match'; go('detail')">Ver restaurante</div>
            <div class="btn-sm fav saved" onclick="toggleFav(${r.id})">Eliminar</div>
          </div>
        </div>
      </div>
    `).join("")}
  `;
}
/* ============ PROFILE ============ */
function renderProfile(){
  const p = state.prefs;
  return `
    <h2 style="font-size:22px; margin-bottom:18px;">Perfil</h2>
    <div class="profile-head"><div class="avatar">FM</div><div><div style="font-weight:700; font-size:16px;">Tu perfil gastronómico</div><div style="color:var(--gray); font-size:12.5px;">📍 ${state.location}</div></div></div>
    <div class="section-label">Preferencias guardadas</div>
    <div style="margin-bottom:22px;">
      ${p.cuisines.length? p.cuisines.map(c=>`<span class="pref-summary-tag">${c}</span>`).join("") : `<span style="color:var(--gray); font-size:13px;">Aún no defines tus tipos de comida favoritos.</span>`}
      ${p.liked.map(c=>`<span class="pref-summary-tag">😋 ${c}</span>`).join("")}
      ${p.avoid.map(c=>`<span class="pref-summary-tag">🚫 ${c}</span>`).join("")}
      ${p.budget? `<span class="pref-summary-tag">💰 ${p.budget}</span>`:""}
    </div>
    <div class="list-item" onclick="go('prefs')"><div class="li-lbl">✏️ Editar preferencias</div><span>›</span></div>
    <div class="list-item" onclick="changeLocation()"><div class="li-lbl">📍 Cambiar ubicación</div><span>›</span></div>
    <div class="list-item" onclick="go('favorites')"><div class="li-lbl">❤️ Restaurantes favoritos (${state.favorites.size})</div><span>›</span></div>
    <div class="section-label" style="margin-top:22px;">Historial de búsquedas</div>
    ${state.history.length? state.history.map(h=>`<div class="hist-item">🕐 ${h}</div>`).join("") : `<div style="color:var(--gray); font-size:13px;">Tus búsquedas recientes aparecerán aquí.</div>`}
  `;
}

/* ============ NAV ============ */
function renderNav(){
  const items = [{v:"home", ic:"🏠", lb:"Inicio"},{v:"results", ic:"🔎", lb:"Explorar"},{v:"favorites", ic:"❤️", lb:"Favoritos"},{v:"profile", ic:"👤", lb:"Perfil"}];
  return items.map(i=>`<div class="navitem ${state.view===i.v?'active':''}" onclick="go('${i.v}')"><div class="ic">${i.ic}</div><div class="lb">${i.lb}</div></div>`).join("");
}

/* ============ MAIN ============ */
function render(){
  const map = { home: renderHome, prefs: renderPrefs, group: renderGroup, results: renderResults, detail: renderDetail, favorites: renderFavorites, profile: renderProfile };
  document.getElementById('main').innerHTML = (map[state.view]||renderHome)();
  document.getElementById('bottomnav').innerHTML = renderNav();
}
render();
</script>
</body>
</html>
